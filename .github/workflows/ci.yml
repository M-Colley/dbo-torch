name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples matlab_parity

      - name: Test
        run: pytest -q --cov=dbo_torch --cov-report=term-missing

  licence-guard:
    # BayesianOptimization.m is MathWorks-copyrighted toolbox source. It must
    # never enter this repository, whatever .gitignore says. See PROVENANCE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse MathWorks-copyrighted files
        run: |
          if git ls-files | grep -i 'BayesianOptimization\.m'; then
            echo "::error::BayesianOptimization.m is MathWorks toolbox source and cannot be redistributed."
            exit 1
          fi
          # PROVENANCE.md and this workflow both quote the notice in order to
          # explain and enforce the rule, so they are exempt from it.
          if git grep -l -i 'Copyright.*The MathWorks' -- . \
               ':!PROVENANCE.md' ':!.github/workflows/ci.yml'; then
            echo "::error::A file carries a MathWorks copyright notice."
            exit 1
          fi
          echo "No MathWorks-copyrighted content found."
